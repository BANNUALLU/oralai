<!DOCTYPE html>
<html>
<head>
<title>Start Screening</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins';
    background:#ffffff;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
.card{
    background:white;
    width:500px;
    padding:55px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 20px 40px rgba(0,0,0,0.1);
}
h1{ color:#0a3d91; }
p{
    color:#555;
    margin:20px 0 35px;
}
.btn{
    display:block;
    padding:15px;
    border-radius:10px;
    font-weight:600;
    text-decoration:none;
    margin-top:15px;
}
.primary{
    background:#0a66c2;
    color:white;
}
.secondary{
    background:#f1f5ff;
    color:#0a66c2;
}
</style>
</head>

<body>
<div class="card">
    <h1>AI Oral Health Screening</h1>
    <p>
        Upload dental images and let Artificial Intelligence
        analyze possible oral health issues in seconds.
    </p>

    <a href="/details" class="btn primary">Start New Screening</a>
    <a href="/" class="btn secondary">Back</a>
</div>
</body>
</html>
